[package]
name = "memoir-core"
description = "Memoir domain logic: vault, crypto, local store, sync engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
keyring = "4.2.0"
pulldown-cmark = { version = "0.13.5", default-features = false }
rusqlite = { version = "0.41.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
ulid = "3.0.0"
unicode-normalization = "0.1.26"
zeroize = { version = "1.9.1", features = ["derive"] }
zstd = "0.14.3"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
