[package]
name = "memoir-cli"
description = "Offline recovery and export tool for Memoir vaults"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "memoir"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
log = "0.4.34"
memoir-core = { path = "../memoir-core" }
rpassword = "7.5.4"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt"] }
zeroize = "1.9.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
