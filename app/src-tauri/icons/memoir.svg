<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Memoir app icon: a journal with a clasp (a private diary).
       Drawn on a 100-unit grid. Regenerate the PNG/ICO/ICNS files with
       `npm run tauri icon src-tauri/icons/memoir.svg` (then delete the
       android/ios folders it also creates). -->
  <g transform="translate(48 48) scale(9.28)">
    <!-- Background -->
    <rect width="100" height="100" rx="22" fill="#1F3A5F"/>
    <!-- Page edges, peeking out on the right -->
    <rect x="72" y="21" width="6" height="58" rx="2" fill="#F6EBD4"/>
    <!-- Cover and spine -->
    <rect x="25" y="17" width="50" height="66" rx="5" fill="#E8A33D"/>
    <rect x="25" y="17" width="9" height="66" rx="3" fill="#C27A22"/>
    <!-- Clasp with keyhole -->
    <rect x="58" y="42" width="22" height="16" rx="4" fill="#1F3A5F"/>
    <circle cx="69" cy="48.5" r="2.6" fill="#E8A33D"/>
    <rect x="68" y="49" width="2" height="5" rx="0.6" fill="#E8A33D"/>
  </g>
</svg>
