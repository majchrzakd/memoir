      <stop offset="0" stop-color="#4f7ff7"/>
      <stop offset="1" stop-color="#2f5ad8"/>
    </linearGradient>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#bg)"/>
  <!-- Page -->
  <path d="M312 232h290l150 150v378a40 40 0 0 1-40 40H312a40 40 0 0 1-40-40V272a40 40 0 0 1 40-40z" fill="#ffffff"/>
  <!-- Folded corner -->
  <path d="M602 232v110a40 40 0 0 0 40 40h110z" fill="#c9d6fb"/>
