[package]
name = "memoir-app"
description = "Memoir desktop/mobile shell (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "memoir_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["sync", "time"] }
memoir-core = { version = "0.1.0", path = "../../crates/memoir-core" }
thiserror = "2.0.21"
zeroize = "1.9.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.3"

[dev-dependencies]
tempfile = "3.27.0"
