name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-ios-sim' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Frontend checks (types, lint, tests)
        working-directory: app
        run: |
          npm run check
          npm run lint
          npm run test

      # Tauri embeds the built frontend at compile time.
      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      # The iOS app's Rust code (memoir-core and the Tauri shell) still builds.
      - name: Rust lint for iOS
        if: runner.os == 'macOS'
        run: cargo clippy -p memoir-core -p memoir-app --target aarch64-apple-ios-sim -- -D warnings
