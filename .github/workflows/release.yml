name: Release

# Builds the Windows installer and the macOS app (one universal build for
# Apple silicon and Intel), signs the updates and creates a *draft* GitHub
# release "v<version>" (version from app/src-tauri/tauri.conf.json) with
# the installers, their signatures and latest.json, which installed copies
# check for updates. Review the draft, then publish it. See docs/RELEASE.md.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Check that the secrets are set
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.MEMOIR_GOOGLE_CLIENT_ID }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [ -n "$CLIENT_ID" ] || { echo "::error::Set the MEMOIR_GOOGLE_CLIENT_ID repository secret"; exit 1; }
          [ -n "$SIGNING_KEY" ] || { echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY repository secret"; exit 1; }
          ! grep -q REPLACE_WITH_UPDATE_PUBLIC_KEY app/src-tauri/tauri.conf.json || { echo "::error::Put the update public key (memoir.key.pub) into tauri.conf.json"; exit 1; }

      # Developer ID signing and notarization, once the Apple secrets exist
      # (docs/RELEASE.md). Without them the app is signed ad hoc.
      - name: Apple signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No Apple certificate; the macOS app is signed ad hoc and not notarized"
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Built into the app (option_env! in cloud.rs).
          MEMOIR_GOOGLE_CLIENT_ID: ${{ secrets.MEMOIR_GOOGLE_CLIENT_ID }}
          MEMOIR_GOOGLE_CLIENT_SECRET: ${{ secrets.MEMOIR_GOOGLE_CLIENT_SECRET }}
          # Signs the update (the app checks it with the public key).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: Memoir __VERSION__
          releaseBody: |
            **Windows:** download and run **Memoir___VERSION___x64-setup.exe**.
            **macOS:** download **Memoir___VERSION___universal.dmg** and drag Memoir to Applications.

            Memoir updates itself from here on.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
