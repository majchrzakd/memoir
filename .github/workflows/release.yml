name: Release

# Creates a *draft* GitHub release "v<version>" (version from
# app/src-tauri/tauri.conf.json), then builds the Windows installer and the
# macOS app (one universal build for Apple silicon and Intel) into it, with
# their update signatures and latest.json, which installed copies check for
# updates. Review the draft, then publish it. See docs/RELEASE.md.

on:
  workflow_dispatch:

permissions:
  contents: write

# One release run at a time: each run replaces the version's draft.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # One draft for both builds (created here, so they don't race to create it).
  draft:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the secrets are set
        env:
          CLIENT_ID: ${{ secrets.MEMOIR_GOOGLE_CLIENT_ID }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [ -n "$CLIENT_ID" ] || { echo "::error::Set the MEMOIR_GOOGLE_CLIENT_ID repository secret"; exit 1; }
          [ -n "$SIGNING_KEY" ] || { echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY repository secret"; exit 1; }
          ! grep -q REPLACE_WITH_UPDATE_PUBLIC_KEY app/src-tauri/tauri.conf.json || { echo "::error::Put the update public key (memoir.key.pub) into tauri.conf.json"; exit 1; }

      # Always a fresh draft: an older one for this version may be from an
      # earlier workflow, or be deleted while this run builds.
      - name: Create the draft release (replacing an older draft)
        id: draft
        uses: actions/github-script@v7
        with:
          script: |
            const { version } = require('./app/src-tauri/tauri.conf.json')
            const tag = `v${version}`
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo)
            if (releases.some((r) => !r.draft && r.tag_name === tag)) {
              throw new Error(`${tag} is already published. Set a new version in app/src-tauri/tauri.conf.json and Cargo.toml.`)
            }
            for (const old of releases.filter((r) => r.draft && r.tag_name === tag)) {
              await github.rest.repos.deleteRelease({ ...context.repo, release_id: old.id })
              core.info(`Deleted the older draft ${old.id} for ${tag}`)
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Memoir ${version}`,
              body: [
                `**Windows:** download and run **Memoir_${version}_x64-setup.exe**.`,
                `**macOS:** download **Memoir_${version}_universal.dmg** and drag Memoir to Applications.`,
                '',
                'Memoir updates itself from here on.',
              ].join('\n'),
              draft: true,
              prerelease: false,
            })
            core.info(`Created draft ${data.id} for ${tag}`)
            return data.id

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # Developer ID signing and notarization, once the Apple secrets exist
      # (docs/RELEASE.md). Without them the app is signed ad hoc.
      - name: Apple signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          names="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID"
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No Apple certificate; the macOS app is signed ad hoc and not notarized"
            exit 0
          fi
          missing=0
          for name in $names; do
            [ -n "${!name}" ] || { echo "::error::Set the $name repository secret (needed with APPLE_CERTIFICATE)"; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
          for name in $names; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done

      # Fail early and clearly if the draft disappeared (rather than with
      # "Not Found" after the whole build).
      - name: Check that the draft release still exists
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        with:
          script: |
            const id = Number(process.env.RELEASE_ID)
            try {
              const { data } = await github.rest.repos.getRelease({ ...context.repo, release_id: id })
              core.info(`Uploading to draft ${id} (${data.tag_name})`)
            } catch (e) {
              core.setFailed(`The draft release ${id} no longer exists (deleted while this run was going?). Run the Release workflow again.`)
            }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Built into the app (option_env! in cloud.rs).
          MEMOIR_GOOGLE_CLIENT_ID: ${{ secrets.MEMOIR_GOOGLE_CLIENT_ID }}
          MEMOIR_GOOGLE_CLIENT_SECRET: ${{ secrets.MEMOIR_GOOGLE_CLIENT_SECRET }}
          # Signs the update (the app checks it with the public key).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: ${{ matrix.args }}
